# SliqDesk frontend: serves the React build and reverse-proxies /api and /socket.io
# to the backend container, so the browser only ever talks to one origin.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream sliqdesk_backend {
  server backend:5000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # Security headers (inherited by locations that do not define their own add_header)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # REST API
  location /api/ {
    proxy_pass http://sliqdesk_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.IO (WebSocket upgrade + long-polling fallback)
  location /socket.io/ {
    proxy_pass http://sliqdesk_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Fingerprinted build assets can be cached forever
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # React Router fallback: unknown paths serve index.html (never cached)
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
