# SliqDesk - docker compose up -d --build
# Project name is explicit so it never collides with other compose projects in a folder named "sliqdesk".
name: sliqdesk-app

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"   # for DBeaver / psql from the host
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY when the pgdata volume is empty (first initialisation).
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [sliqdesk]

  backend:
    build: ./backend
    image: sliqdesk-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_KEYS_DIR: /app/keys
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"    # direct API access for development
    volumes:
      - jwt_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [sliqdesk]

  worker:
    # Same build context + tag as the API => one shared image (second build is a cache hit).
    build: ./backend
    image: sliqdesk-backend:latest
    restart: always
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sliqdesk]
    # no ports: the worker exposes no HTTP interface

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [sliqdesk]

networks:
  sliqdesk:
    driver: bridge

volumes:
  pgdata:
  jwt_keys:
